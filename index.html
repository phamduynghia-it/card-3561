<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Love Letter</title>
        <link
            href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <!-- Hearts Container -->
            <div class="hearts-container" id="heartsContainer">
                <!-- Hearts will be generated by JavaScript -->
            </div>

            <!-- Mailbox -->
            <div class="mailbox-wrapper" id="mailboxWrapper">
                <div class="mailbox" id="mailbox">
                    <img
                        src="images/close.png"
                        alt="closed mailbox"
                        class="mailbox-img closed"
                        id="closedMailbox"
                    />
                    <img
                        src="images/hopopen.png"
                        alt="open mailbox"
                        class="mailbox-img open"
                        id="openMailbox"
                    />
                </div>
            </div>

            <!-- Letter content -->
            <div class="letter" id="letter">
                <div class="corner-hearts">
                    <span class="heart tl">❤</span>
                    <span class="heart tr">❤</span>
                    <span class="heart bl">❤</span>
                    <span class="heart br">❤</span>
                </div>
                <div class="message" id="messageBox" style="font-size: 16px; white-space: pre-wrap; text-align: left;"></div>
            </div>
        </div>

        <!-- Audio element -->
        <audio id="backgroundMusic" loop>
            <source src="./assets/user_bg_music.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
        </audio>

        <script>
            window.CONFIG = {
                message: `Chúc bé yêu của anh ngày 20/10 thật hạnh phúc nhé ❤️🥰

Anh biết rằng phía sau bộ quân phục của bé là những ngày tháng đầy trách nhiệm, những lần vất vả chẳng thể kể hết và cả những lúc mệt mỏi mà bé vẫn phải mạnh mẽ. Anh chỉ mong bé luôn bình an, luôn được bảo vệ và yêu thương như cách bé vẫn âm thầm bảo vệ bình yên cho mọi người.

Bé à, anh không thể ở bên bé trong mọi khoảnh khắc, cũng chẳng thể thay bé gánh hết những nhọc nhằn của cuộc sống. Nhưng anh mong mình có thể trở thành người mà mỗi khi bé mệt mỏi, bé muốn tìm đến; mỗi khi bé buồn, bé muốn sẻ chia; và mỗi khi bé cần một chút dịu dàng, bé biết rằng luôn có anh ở đây.

Bé dành cả trái tim để giữ gìn bình yên cho mọi người, còn anh chỉ mong có một ngày được dùng cả sự chân thành của mình để chăm sóc trái tim bé. ❤️

Chúc chàng công an  anh thương luôn bình an trên mọi nẻo đường, vững vàng trong mọi nhiệm vụ và hạnh phúc trong cả những điều bình dị nhất. Mong rằng giữa thế giới rộng lớn này, anh sẽ có cơ hội trở thành một phần bình yên nhỏ bé nhưng đặc biệt trong cuộc đời bé. Thương bé nhiều hơn những gì anh có thể nói thành lời. 💗😘

                                                                                                               David Van Le
                                                                                                                20/10/2026
`
            };
        </script>
        <script src="script.js"></script>
    	<!-- Cơ chế bảo mật (Chống soi code) -->
	<script src="./anti-devtools.js"></script>
</body>
</html>
